name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint + format ─────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Check formatting
        run: ruff format --check restorax/ tests/ scripts/

      - name: Lint
        run: ruff check restorax/ tests/ scripts/

  # ── Type checking ─────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies (CPU torch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install basicsr av opencv-python-headless
          pip install -e ".[dev]"

      - name: mypy
        run: mypy restorax/ --ignore-missing-imports --no-strict-optional

  # ── Migrations ────────────────────────────────────────────────────────────────
  migrations:
    name: Migrations (alembic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies (CPU torch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install basicsr av opencv-python-headless
          pip install -e ".[dev]"

      - name: Upgrade on a fresh database, then verify no model drift
        env:
          RESTORAX_DATABASE_URL: sqlite+aiosqlite:///./migration_check.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          # Fails if models.py and alembic/versions disagree (the exact bug that made
          # create_all the only schema path).
          alembic check

  # ── Unit tests ────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies (CPU torch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install basicsr av opencv-python-headless
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -v --tb=short \
            --cov=restorax --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          file: coverage.xml
        continue-on-error: true

  # ── Integration + system tests ────────────────────────────────────────────────
  integration-tests:
    name: Integration & System Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies (CPU torch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install basicsr av opencv-python-headless
          pip install -e ".[dev]"

      - name: Run integration tests
        run: python -m pytest tests/integration/ -v --tb=short

      - name: Run system tests
        run: python -m pytest tests/system/ -v --tb=short

  # ── Frontend typecheck ────────────────────────────────────────────────────────
  frontend-typecheck:
    name: Frontend Typecheck (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  # ── Frontend build ────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build (Vite)
    runs-on: ubuntu-latest
    needs: frontend-typecheck
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

  # ── Security & supply chain ───────────────────────────────────────────────────
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose

  python-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies (CPU torch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install basicsr av opencv-python-headless
          pip install -e .
          pip install pip-audit "setuptools>=83"

      # Ignored: PYSEC-2026-1215 / CVE-2024-27763 (basicsr command injection through the
      # SLURM_NODELIST environment variable in its distributed-training helper). No fixed
      # release exists, an attacker needs control of the process environment, and RestoraX
      # only uses basicsr's network architectures, never its SLURM launcher.
      # Remove the ignore once basicsr ships a fix.
      - name: pip-audit
        run: pip-audit --skip-editable --progress-spinner off --ignore-vuln PYSEC-2026-1215

  npm-audit:
    name: Dependency audit (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  workflows:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run actionlint
        run: |
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz | tar -xz actionlint
          ./actionlint -color

  # Needs "Dependency graph" enabled (Settings > Advanced Security). Once it is on,
  # set the repository variable ENABLE_DEPENDENCY_REVIEW=true to turn this job on.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' && vars.ENABLE_DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  # ── Docker build ──────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: restorax:ci

      - name: Boot the API image and hit /health + /models
        # Building an image proves nothing about whether it starts: the API image was
        # missing structlog/torch/otel/prometheus-client and could never boot.
        run: |
          docker run -d --name restorax-api -p 8000:8000 \
            -e RESTORAX_DATABASE_URL=sqlite+aiosqlite:////tmp/boot.db \
            -e RESTORAX_DEVICE=cpu \
            restorax:ci
          ok=0
          for _ in $(seq 1 40); do
            if curl -fsS http://localhost:8000/health >/dev/null; then ok=1; break; fi
            sleep 2
          done
          echo "health ok=$ok"
          if [ "$ok" = "1" ]; then
            curl -fsS http://localhost:8000/models | head -c 200
            curl -fsS -o /dev/null -w "\nmetrics:%{http_code}\n" http://localhost:8000/metrics
          fi
          docker logs restorax-api
          docker rm -f restorax-api
          [ "$ok" = "1" ]

      - name: Build worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.worker
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: restorax-worker:ci
