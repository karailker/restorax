[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "restorax"
version = "0.1.0"
description = "Modern AI video restoration platform"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",  # FastAPI file upload (Form/UploadFile)
    # Task queue
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    # Config / validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    # Video I/O
    "av>=12.0.0",
    # ML
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",  # vendored ProPainter / RAFT
    "einops>=0.7.0",  # vendored ProPainter
    "pillow>=10.3.0",
    "opencv-python-headless>=4.9.0",
    # ML toolboxes
    "basicsr>=1.4.2",
    # Quality metrics
    "piqa>=1.3.0",
    # Observability
    "structlog>=24.1.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-celery>=0.45b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
    "opentelemetry-instrumentation-redis>=0.45b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
    "opentelemetry-exporter-prometheus>=0.45b0",
    "prometheus-client>=0.20.0",
    # Weights download
    "huggingface-hub>=0.23.0",
    # Utilities
    "click>=8.1.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
sr = [
    "timm>=0.9.0",
    "einops>=0.7.0",
    "mamba-ssm>=2.0.3",
]
face = [
    "gfpgan>=1.3.8",
    "facexlib>=0.3.0",
    "einops>=0.7.0",
]
diffusion = [
    "diffusers>=0.27.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "sentencepiece>=0.2.0",
]
extras = [
    "einops>=0.7.0",
    "kornia>=0.7.0",
    "imageio[ffmpeg]>=2.34.0",
]
waifu2x = [
    "py7zr>=0.20.0",
]
apm = [
    "sentry-sdk[fastapi,celery]>=2.0.0",
]
all = ["restorax[sr,face,diffusion,extras,waifu2x,apm]"]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-celery>=1.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12",
    "types-redis>=4.6.0",
]

[project.scripts]
restorax = "restorax.cli:cli"

# ── Plugin entry points ────────────────────────────────────────────────────────
# Third-party restorer plugins register under this group.
# Example in a plugin's pyproject.toml:
#   [project.entry-points."restorax.restorers"]
#   my_restorer = "my_package.restorer:MyRestorer"
[project.entry-points."restorax.restorers"]
real_esrgan_x4plus   = "restorax.restorers.super_resolution.real_esrgan:RealESRGANx4Restorer"
basicvsr_pp_x4       = "restorax.restorers.super_resolution.basicvsr_pp:BasicVSRPlusPlusRestorer"
vrt_x4               = "restorax.restorers.super_resolution.vrt:VRTRestorer"
upscale_a_video      = "restorax.restorers.super_resolution.upscale_a_video:UpscaleAVideoRestorer"
ddcolor              = "restorax.restorers.colorization.ddcolor:DDColorRestorer"
codeformer           = "restorax.restorers.face_restoration.codeformer:CodeFormerRestorer"
gfpgan_v14           = "restorax.restorers.face_restoration.gfpgan:GFPGANRestorer"
rife_v4              = "restorax.restorers.frame_interpolation.rife:RIFERestorer"
scratch_removal      = "restorax.restorers.artifact_removal.scratch_removal:ScratchRemovalRestorer"
hdrtvdm              = "restorax.restorers.hdr.hdrtvdm:HDRTVDMRestorer"
video_stabilization  = "restorax.restorers.stabilization.deep_flow_stab:VideoStabilizationRestorer"
ai_deinterlace       = "restorax.restorers.deinterlacing.ai_deinterlace:AIDeinterlaceRestorer"
mamba_ir_x4          = "restorax.restorers.super_resolution.mamba_ir:MambaIRRestorer"
tdm                  = "restorax.restorers.super_resolution.tdm:TDMRestorer"
codeformer_pp        = "restorax.restorers.face_restoration.codeformer_pp:CodeFormerPlusPlusRestorer"
gavs                 = "restorax.restorers.stabilization.gavs:GaVSRestorer"
waifu2x_x2           = "restorax.restorers.super_resolution.waifu2x:Waifu2xRestorer"
flashvsr_x4          = "restorax.restorers.super_resolution.flashvsr:FlashVSRRestorer"
evtexture_x4         = "restorax.restorers.super_resolution.evtexture:EvTextureRestorer"
seedvr               = "restorax.restorers.super_resolution.seedvr:SeedVRRestorer"
dicface              = "restorax.restorers.face_restoration.dicface:DicFaceRestorer"
dlss5_visual_enhancer = "restorax.restorers.enhancement.dlss5_visual_enhancer:DLSS5VisualEnhancerRestorer"

[tool.hatch.build.targets.wheel]
packages = ["restorax"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
# Vendored third-party architectures are kept byte-identical to upstream.
extend-exclude = [
    "comfyui_nodes",  # git submodule: karailker/restorax-comfyui (linted in its own repo)
    "restorax/restorers/*/*_arch.py",
    "restorax/restorers/*/rife_arch",
    "restorax/restorers/artifact_removal/propainter",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = [
    "E501",
    "B008",  # FastAPI Depends()/Query() defaults are idiomatic
    "UP042",  # str+Enum is kept for pydantic/JSON compatibility
    "S101",  # assert is used for type narrowing, not validation
]

[tool.ruff.lint.per-file-ignores]
# Tests/scripts legitimately import after sys.path or importorskip setup.
"tests/**" = ["E402", "B905", "SIM117", "S"]
"scripts/**" = ["E402", "S"]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_subclassing_any = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
# Optional deps (basicsr, mamba-ssm, ...) differ per environment, so ignores may flip.
warn_unused_ignores = false
# Still off (next ratchet steps): warn_return_any (~22 values coming from untyped
# third-party libs such as OpenCV) and no_implicit_reexport.

# Vendored upstream architectures are kept as-is and are not type-checked.
[[tool.mypy.overrides]]
module = [
    "restorax.restorers.artifact_removal.propainter_arch",
    "restorax.restorers.face_restoration.codeformer_arch",
    "restorax.restorers.face_restoration.vqgan_arch",
    "restorax.restorers.frame_interpolation.rife_arch.*",
    "restorax.restorers.super_resolution.evtexture_arch",
    "restorax.restorers.super_resolution.upscale_a_video_arch",
    "restorax.restorers.super_resolution.vrt_arch",
    "restorax.restorers.super_resolution.waifu2x_arch",
    "restorax.restorers.artifact_removal.propainter.*",
]
ignore_errors = true

# Celery's decorators/Task base class are untyped.
[[tool.mypy.overrides]]
module = ["restorax.tasks.job_tasks", "restorax.tasks.celery_app"]
disallow_untyped_decorators = false
disallow_subclassing_any = false

# Calls into vendored (untyped) upstream architectures and optional instrumentation.
[[tool.mypy.overrides]]
module = [
    "restorax.restorers.super_resolution.waifu2x",
    "restorax.restorers.super_resolution.evtexture",
    "restorax.restorers.super_resolution.vrt",
    "restorax.restorers.face_restoration.codeformer",
    "restorax.restorers.frame_interpolation.rife",
    "restorax.telemetry",
]
disallow_untyped_calls = false

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not benchmark'"
markers = [
    "requires_weights: skip if named model weights are absent from model_dir",
    "requires_assets: skip if standard test assets are not downloaded",
    "benchmark: excluded from default run; invoke with pytest -m benchmark",
    "gpu: requires a CUDA GPU",
    "slow: slow integration tests",
]
